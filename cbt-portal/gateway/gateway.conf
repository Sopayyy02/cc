# API Gateway + Load Balancer lokal (Docker Compose).
# Di AWS peran ini diganti API Gateway (HTTP API) + Application Load Balancer.
resolver 127.0.0.11 valid=5s ipv6=off;   # DNS Docker: tiap replika service ikut terdeteksi saat di-scale

# Zona rate limit (api, login) didefinisikan di conf.d/00-limits.conf (gateway/limits.conf).
# Saat stress test, file itu diganti limits-stress.conf lewat docker-compose.stress.yml.

server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection        "";
  proxy_connect_timeout 10s;
  proxy_read_timeout    30s;
  # Bila satu replika gagal, request diulang ke replika lain (hanya method idempoten).
  proxy_next_upstream         error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries   3;
  proxy_next_upstream_timeout 10s;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }

  # Frontend statis
  location / { try_files $uri /index.html; }

  # Endpoint internal antar-service tidak boleh diakses dari luar
  location /internal { return 404; }

  location = /api/login {
    limit_req zone=login burst=1000 nodelay;
    set $up http://auth-service:3000;
    proxy_pass $up;
  }
  location ~ ^/api/(me|logout)$ {
    limit_req zone=api burst=2000 nodelay;
    set $up http://auth-service:3000;
    proxy_pass $up;
  }
  location /api/exams {
    limit_req zone=api burst=2000 nodelay;
    set $up http://exam-service:3000;
    proxy_pass $up;
  }
  location /api/sessions {
    limit_req zone=api burst=2000 nodelay;
    set $up http://session-service:3000;
    proxy_pass $up;
  }
}
