# Rate limit dilonggarkan KHUSUS stress test. Alasannya: k6 mengirim semua VU dari satu IP,
# sehingga rate limit per-IP akan menolak request (503) sebelum menyentuh service dan
# titik gagal yang tercatat bukan batas infrastruktur sebenarnya.
# Pakai:  docker compose -f docker-compose.yml -f docker-compose.stress.yml up -d
limit_req_zone $binary_remote_addr zone=api:10m   rate=100000r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=100000r/s;
